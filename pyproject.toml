[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kid-pc-monitor"
version = "4.0.0"
description = "DIY parental control system for parents who code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=3.0",
    "flask>=2.0.0",
    'pywin32>=300; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "basedpyright>=1.29",
    "pre-commit>=4",
]

[project.scripts]
kid-pc-web-panel = "kid_pc_monitor.web_panel:main"
kid-pc-agent = "kid_pc_monitor.pc_control:main"
kid-pc-cli = "kid_pc_monitor.pc_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kid_pc_monitor = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kid_pc_monitor"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = "venv"
reportMissingImports = true
reportUnusedImport = true
reportUnusedVariable = true
