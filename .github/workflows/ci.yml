name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Matches pyproject.toml basedpyright venvPath/venv settings.
      - name: Create venv and install
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -e ".[dev]"

      - name: Ruff
        run: ./venv/bin/ruff check src tests

      - name: Basedpyright
        run: ./venv/bin/basedpyright

      - name: Pytest
        run: ./venv/bin/pytest

  # Single required check for branch rules / Dependabot auto-merge.
  ci:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All matrix jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.test.result }}"
            exit 1
          fi
