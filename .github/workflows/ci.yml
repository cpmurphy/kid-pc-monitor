name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs the whole suite before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Matches pyproject.toml basedpyright venvPath/venv settings.
      - name: Create venv and install
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -e ".[dev]"

      - name: Ruff
        run: ./venv/bin/ruff check src tests

      - name: Basedpyright
        run: ./venv/bin/basedpyright

      - name: Pytest
        run: ./venv/bin/pytest

  # Go protocol port: golden vectors + live cross-check against the Python side.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: gofmt
        run: test -z "$(gofmt -l go)"

      - name: go vet
        run: cd go && go vet ./...

      - name: go test
        run: cd go && go test -race ./...

      - name: Cross-check against Python
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -e ".[dev]"
          ./venv/bin/python scripts/cross_check_go.py

  # The Windows-only Go code (winplatform, the agent itself), the installer's
  # functions, and the real agent against the Python panel (cross-check D).
  go-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: go test
        working-directory: go
        run: go test ./...

      - name: Build the agent as releases do
        working-directory: go
        run: go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w" -o kid-pc-agent.exe ./cmd/kid-pc-agent

      - name: Install Python package
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\install_agent_test.ps1 -Python .\venv\Scripts\python.exe

      - name: Cross-check against Python
        run: .\venv\Scripts\python.exe scripts/cross_check_go.py

  # Single required check for branch rules / Dependabot auto-merge.
  ci:
    needs: [test, go, go-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.go.result }}" != "success" ] || [ "${{ needs.go-windows.result }}" != "success" ]; then
            echo "test: ${{ needs.test.result }}, go: ${{ needs.go.result }}, go-windows: ${{ needs.go-windows.result }}"
            exit 1
          fi
