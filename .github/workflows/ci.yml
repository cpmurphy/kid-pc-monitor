name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs the whole suite before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  # Decides whether the change touches anything the tests exercise. The
  # workflow always runs (no paths-ignore) so the required `ci` check always
  # reports; for documentation-only changes the test jobs are skipped instead.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Anything not matched here counts as code. When the diff can't be
          # computed (release tag, new branch, rewritten history) run everything.
          docs_only='^([^/]+\.md|docs/.*|screenshots/.*)$'
          code=true
          if [ "$EVENT" = pull_request ] || [ "$REF" = refs/heads/main ]; then
            if files=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) && [ -n "$files" ]; then
              echo "$files"
              if ! echo "$files" | grep -qvE "$docs_only"; then
                code=false
              fi
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build the web panel for every release target
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/kid-pc-web-panel
          done

      # The panel uses modernc.org/sqlite; the agent must stay standard-library only.
      - name: Agent has no third-party dependencies
        run: |
          deps=$(GOOS=windows go list -deps ./cmd/kid-pc-agent | grep -E '^[a-z0-9-]+\.[a-z]' || true)
          if [ -n "$deps" ]; then echo "kid-pc-agent imports: $deps"; exit 1; fi

  # The Windows-only Go code (winplatform, the agent itself) and the
  # installer's functions.
  go-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build the agent as releases do
        run: go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w" -o kid-pc-agent.exe ./cmd/kid-pc-agent

      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\install_agent_test.ps1

      - name: Build the web panel as releases do
        run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o kid-pc-web-panel.exe ./cmd/kid-pc-web-panel

      - name: Web panel installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\install_web_panel_test.ps1 -PanelExe .\kid-pc-web-panel.exe

  # Single required check for branch rules / Dependabot auto-merge. Skipped
  # test jobs pass only when `changes` itself succeeded and found no code.
  ci:
    needs: [changes, go, go-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GO: ${{ needs.go.result }}
          GO_WINDOWS: ${{ needs.go-windows.result }}
        run: |
          echo "changes: $CHANGES (code=$CODE), go: $GO, go-windows: $GO_WINDOWS"
          if [ "$CHANGES" != success ]; then exit 1; fi
          ok=success
          if [ "$CODE" = false ]; then ok=skipped; fi
          for r in "$GO" "$GO_WINDOWS"; do
            if [ "$r" != "$ok" ]; then exit 1; fi
          done
