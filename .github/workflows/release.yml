name: Release

# Push a tag such as v1.2.0 to publish kid-pc-agent.exe (amd64 and arm64),
# install_agent.ps1 and SHA256SUMS on that tag's GitHub release.
# scripts/install_agent.ps1 downloads from here when Go is not installed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      # Standard library only, so the Windows binaries cross-compile here.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd go && CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-H=windowsgui -s -w -X main.version=$TAG" \
              -o "../dist/kid-pc-agent-windows-$arch.exe" ./cmd/kid-pc-agent)
          done
          cp scripts/install_agent.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
