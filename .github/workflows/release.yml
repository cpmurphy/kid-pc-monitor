name: Release

# Push a tag such as v1.2.0 to publish kid-pc-agent.exe (amd64 and arm64),
# kid-pc-web-panel for Windows, Linux and macOS (amd64 and arm64),
# install_agent.ps1, install_web_panel.ps1 and SHA256SUMS on that tag's GitHub release.
# scripts/install_agent.ps1 downloads from here when Go is not installed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      # No cgo anywhere (the panel's SQLite is pure Go), so every binary
      # cross-compiles here.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd go && CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-H=windowsgui -s -w -X main.version=$TAG" \
              -o "../dist/kid-pc-agent-windows-$arch.exe" ./cmd/kid-pc-agent)
          done
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            (cd go && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "../dist/kid-pc-web-panel-$os-$arch$ext" ./cmd/kid-pc-web-panel)
          done
          cp scripts/install_agent.ps1 scripts/install_web_panel.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
